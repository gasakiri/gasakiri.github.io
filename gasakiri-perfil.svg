<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">gasakiri</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6049"/>
      <stop offset="1" stop-color="#1b3a2c"/>
    </linearGradient>
  </defs>

  <!-- Fundo quadrado: as redes sociais recortam em círculo sozinhas -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Símbolo: "g" feito só de traços (sem depender de fonte) -->
  <g transform="translate(-4 -20)" fill="none" stroke="#f1f7f3" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- bojo -->
    <circle cx="256" cy="236" r="84"/>
    <!-- haste + gancho -->
    <path d="M340 236 V322 C340 374 304 404 252 404 C228 404 208 398 192 386"/>
  </g>

  <!-- Ponto verde-menta no topo da haste (o "cursor") -->
  <circle cx="352" cy="112" r="19" fill="#b9e3cc"/>
</svg>
